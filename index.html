<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock-Out Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14181C;
    --surface:#1C2126;
    --surface-2:#20262C;
    --line:#2A3137;
    --text:#EDEFEF;
    --muted:#8B939A;
    --amber:#F2B84B;
    --teal:#5FB49C;
    --danger:#D9755F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .app{
    width:100%;
    max-width:420px;
    padding:24px 20px 40px;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
  }
  .date{
    font-size:14px;
    color:var(--muted);
    letter-spacing:0.02em;
  }
  .gear{
    background:none;
    border:none;
    color:var(--muted);
    font-size:18px;
    cursor:pointer;
    padding:4px 8px;
    border-radius:8px;
  }
  .gear:hover{ color:var(--text); background:var(--surface-2); }

  .hero{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 22px;
    text-align:center;
    margin-bottom:20px;
  }
  .status-label{
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .status-dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    background:var(--teal);
    margin-right:6px;
    position:relative;
    top:-1px;
  }
  .status-dot.idle{ background:var(--muted); }
  .hero-caption{
    font-size:13px;
    color:var(--muted);
    margin-bottom:14px;
  }
  .hero-number{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:48px;
    line-height:1.1;
    color:var(--amber);
    letter-spacing:-0.01em;
  }
  .hero-number.done{ color:var(--teal); }
  .hero-sub{
    font-size:13px;
    color:var(--muted);
    margin-top:8px;
  }

  .manual-in{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 16px;
    margin-bottom:16px;
  }
  .manual-in label{
    font-size:13px;
    color:var(--muted);
  }
  .manual-in input[type=time]{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
  }

  .section-label{
    font-size:12px;
    color:var(--muted);
    margin:0 2px 8px;
  }

  .log{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .row:last-child{ border-bottom:none; }
  .row-times{
    font-size:15px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:500;
  }
  .row-times .now{ color:var(--teal); }
  .row-dur{
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
  }
  .row-del{
    background:none;
    border:none;
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
    padding:2px 6px;
  }
  .row-del:hover{ color:var(--danger); }
  .empty-row{
    padding:18px 16px;
    color:var(--muted);
    font-size:14px;
    text-align:center;
  }

  .primary-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    margin-top:4px;
  }
  .primary-btn.in{ background:var(--teal); color:#0F1A17; }
  .primary-btn.out{ background:var(--amber); color:#14181C; }

  .settings-panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
    display:none;
  }
  .settings-panel.open{ display:block; }
  .settings-title{
    font-size:13px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .settings-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .settings-row input{
    width:64px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:8px;
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    text-align:center;
  }
  .settings-row label{
    font-size:13px;
    color:var(--muted);
  }
  .settings-row button{
    margin-left:auto;
    background:var(--amber);
    border:none;
    color:#14181C;
    font-weight:600;
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
  }
  .clear-link{
    display:block;
    text-align:center;
    background:none;
    border:none;
    color:var(--muted);
    font-size:12px;
    margin-top:18px;
    cursor:pointer;
    width:100%;
  }
  .clear-link:hover{ color:var(--danger); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="date" id="dateLabel">—</div>
    <button class="gear" id="gearBtn" title="Default hours">⚙</button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-title">Default work duration</div>
    <div class="settings-row">
      <input type="number" id="hoursInput" min="0" max="23"> <label>h</label>
      <input type="number" id="minsInput" min="0" max="59"> <label>m</label>
    </div>
  </div>

  <div class="hero">
    <div class="status-label" id="statusLabel"><span class="status-dot idle" id="statusDot"></span>Not clocked in</div>
    <div class="hero-caption" id="heroCaption">Clock in to get started</div>
    <div class="hero-number" id="heroNumber">--:--</div>
    <div class="hero-sub" id="heroSub"></div>
  </div>

  <div class="manual-in">
    <label for="manualInInput">Clock-in time</label>
    <input type="time" id="manualInInput">
  </div>

  <div class="section-label">Today's sessions</div>
  <div class="log" id="log"></div>

  <button class="primary-btn in" id="mainBtn">Clock In</button>
  <button class="clear-link" id="clearLink">Clear today's log</button>
</div>

<script>
const DEFAULT_MIN_KEY = 'settings:default-minutes';
let defaultMinutes = 560;
let segments = [];
let dayKey = '';

function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function toMinutes(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
function fmtTime(hhmm){
  let [h,m] = hhmm.split(':').map(Number);
  const ampm = h>=12 ? 'PM':'AM';
  h = h%12; if(h===0) h=12;
  return h+':'+String(m).padStart(2,'0')+' '+ampm;
}
function fmtDur(mins){
  const neg = mins<0;
  mins = Math.abs(Math.round(mins));
  const h = Math.floor(mins/60), m = mins%60;
  let s = '';
  if(h>0) s += h+'h ';
  s += m+'m';
  return (neg?'-':'') + s.trim();
}
function addMinutesToHHMM(hhmm, mins){
  let total = toMinutes(hhmm) + mins;
  total = ((total % 1440) + 1440) % 1440;
  const h = Math.floor(total/60), m = total%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

const hasWidgetStorage = (typeof window !== 'undefined') && !!window.storage;

async function storageGet(key){
  if(hasWidgetStorage){
    try{
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}

async function storageSet(key, value){
  if(hasWidgetStorage){
    try{ await window.storage.set(key, value, false); }catch(e){}
    return;
  }
  try{ localStorage.setItem(key, value); }catch(e){}
}

async function loadAll(){
  dayKey = todayKey();
  try{
    const val = await storageGet(DEFAULT_MIN_KEY);
    if(val) defaultMinutes = parseInt(val,10);
  }catch(e){}
  try{
    const val = await storageGet('daylog:'+dayKey);
    if(val) segments = JSON.parse(val);
  }catch(e){ segments = []; }

  const d = new Date();
  document.getElementById('dateLabel').textContent = d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
  document.getElementById('hoursInput').value = Math.floor(defaultMinutes/60);
  document.getElementById('minsInput').value = defaultMinutes%60;

  render();
}

async function saveSegments(){
  await storageSet('daylog:'+dayKey, JSON.stringify(segments));
}
async function saveDefaultMinutes(){
  await storageSet(DEFAULT_MIN_KEY, String(defaultMinutes));
}

function totalWorkedMinutes(){
  let total = 0;
  for(const seg of segments){
    const outT = seg.out || nowHHMM();
    total += toMinutes(outT) - toMinutes(seg.in);
  }
  return total;
}
function isActive(){
  return segments.length>0 && !segments[segments.length-1].out;
}

function render(){
  const active = isActive();
  const worked = totalWorkedMinutes();
  const remaining = defaultMinutes - worked;

  document.getElementById('statusLabel').innerHTML =
    '<span class="status-dot'+(active?'':' idle')+'"></span>' + (active ? 'Clocked in' : 'Not clocked in');

  const heroNumber = document.getElementById('heroNumber');
  const heroCaption = document.getElementById('heroCaption');
  const heroSub = document.getElementById('heroSub');

  if(active){
    const clockOut = addMinutesToHHMM(nowHHMM(), remaining);
    if(remaining <= 0){
      heroCaption.textContent = 'You\'ve hit your ' + fmtDur(defaultMinutes) + ' target';
      heroNumber.textContent = fmtDur(remaining) + ' over';
      heroNumber.classList.add('done');
    }else{
      heroCaption.textContent = 'Clock out by';
      heroNumber.textContent = fmtTime(clockOut);
      heroNumber.classList.remove('done');
    }
    heroSub.textContent = 'Worked so far: ' + fmtDur(worked) + ' of ' + fmtDur(defaultMinutes);
  }else{
    const clockOut = addMinutesToHHMM(nowHHMM(), remaining);
    if(segments.length===0){
      heroCaption.textContent = 'If you start now, clock out by';
      heroNumber.textContent = fmtTime(clockOut);
      heroNumber.classList.remove('done');
      heroSub.textContent = 'Target: ' + fmtDur(defaultMinutes);
    }else if(remaining<=0){
      heroCaption.textContent = 'Day complete';
      heroNumber.textContent = fmtTime(segments[segments.length-1].out || nowHHMM());
      heroNumber.classList.add('done');
      heroSub.textContent = fmtDur(Math.abs(remaining)) + ' over target';
    }else{
      heroCaption.textContent = 'If you clock in now, clock out by';
      heroNumber.textContent = fmtTime(clockOut);
      heroNumber.classList.remove('done');
      heroSub.textContent = fmtDur(remaining) + ' still needed';
    }
  }

  const mainBtn = document.getElementById('mainBtn');
  mainBtn.textContent = active ? 'Clock Out' : 'Clock In';
  mainBtn.className = 'primary-btn ' + (active ? 'out' : 'in');

  const manualInInput = document.getElementById('manualInInput');
  if(document.activeElement !== manualInInput){
    manualInInput.value = segments.length ? segments[segments.length-1].in : '';
  }

  renderLog();
}

function renderLog(){
  const log = document.getElementById('log');
  log.innerHTML = '';

  if(segments.length===0){
    const div = document.createElement('div');
    div.className = 'empty-row';
    div.textContent = 'No sessions yet today';
    log.appendChild(div);
    return;
  }

  segments.forEach((seg, idx)=>{
    const row = document.createElement('div');
    row.className = 'row';
    const dur = (seg.out ? toMinutes(seg.out) : toMinutes(nowHHMM())) - toMinutes(seg.in);
    row.innerHTML = `
      <div class="row-times">${fmtTime(seg.in)} – ${seg.out ? fmtTime(seg.out) : '<span class="now">now</span>'}</div>
      <div class="row-dur">${fmtDur(dur)}</div>
      <button class="row-del" data-idx="${idx}" title="Delete">×</button>
    `;
    row.querySelector('.row-del').addEventListener('click', (e)=>{
      e.stopPropagation();
      segments.splice(idx,1);
      saveSegments();
      render();
    });
    log.appendChild(row);
  });
}

document.getElementById('mainBtn').addEventListener('click', ()=>{
  if(isActive()){
    segments[segments.length-1].out = nowHHMM();
  }else{
    segments.push({in: nowHHMM(), out: null});
  }
  saveSegments();
  render();
});

document.getElementById('manualInInput').addEventListener('change', (e)=>{
  const val = e.target.value;
  if(!val) return;
  if(segments.length === 0){
    segments.push({ in: val, out: null });
  }else{
    segments[segments.length - 1].in = val;
  }
  saveSegments();
  render();
});

document.getElementById('gearBtn').addEventListener('click', ()=>{
  document.getElementById('settingsPanel').classList.toggle('open');
});

function applyDefaultMinutes(){
  const h = parseInt(document.getElementById('hoursInput').value,10) || 0;
  const m = parseInt(document.getElementById('minsInput').value,10) || 0;
  defaultMinutes = h*60+m;
  saveDefaultMinutes();
  render();
}
document.getElementById('hoursInput').addEventListener('change', applyDefaultMinutes);
document.getElementById('minsInput').addEventListener('change', applyDefaultMinutes);

document.getElementById('clearLink').addEventListener('click', ()=>{
  segments = [];
  saveSegments();
  render();
});

loadAll().catch(()=>{ dayKey = todayKey(); render(); });
setInterval(()=>{ if(isActive()) render(); }, 15000);
</script>
</body>
</html>
